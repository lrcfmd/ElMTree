[project]
name = "elmtree"
version = "1.1.0"
description = "ElMTree nearest-neighbour search over chemical compositions by Element Movers Distance, for the LMDS platform"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "jsonschema>=4.26.0",
    "boto3>=1.34.0",
    "structlog>=25.5.0",
    # Index vectors and query vectors must come from the same ElMD (the index
    # records its ElMD version and vector length, checked at load), so ElMD is
    # pinned to the version the index files are built/tested with.
    "ElMD==0.5.15",
    # ElMD imports pkg_resources, which setuptools 81 removed.
    "setuptools<81",
    "numba>=0.60",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pandas>=2.1",
    # ElMTree accepts pymatgen Structure/Composition and ase Atoms inputs.
    "pymatgen>=2024.1.1",
    "ase>=3.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
model-run = "cmds.run:run_cli"
model-types = "cmds.model_types:main"
validate-model = "cmds.validate_model:main"
build-index = "model.build_index:main"
convert-index = "model.convert_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The index file is NOT bundled in the wheel or image — they are provided to
# the application at runtime (see src/model/artifacts/README.md). Exclude them
# explicitly: the Docker build context has no .git, so VCS-ignore alone would
# not keep locally-present files out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/cmds", "src/infrastructure", "src/model", "src/ElMTree"]
exclude = ["src/model/artifacts/*"]

[tool.uv]
package = true
